name: Release

# Packages the app on each target OS. sharp ships per-platform native
# prebuilts that npm only installs for the host OS, so Windows/macOS/Linux
# artifacts must each be built on their own runner (cross-packaging would
# produce an app that cannot load its native image code).
#
# Signing/notarization on macOS is driven by repository secrets; when they are
# absent the mac build is produced unsigned:
#   CSC_LINK, CSC_KEY_PASSWORD     — Developer ID certificate (.p12)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarization
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: windows-latest
            platform: win
            script: dist:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build & package
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-dist
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
